version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**

backend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npx @aws-amplify/backend-cli sandbox --once
