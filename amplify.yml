version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**

backend:
  phases:
    preBuild:
      commands:
        - npm install -g @aws-amplify/backend-cli
    build:
      commands:
        - npx @aws-amplify/backend-cli sandbox --once
        - npx @aws-amplify/backend-cli generate outputs --format ts --out-dir src
